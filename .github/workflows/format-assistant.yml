
name: Correction formatage assistant IA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/test/siteconforme-ia'
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Installer Ruff et Black
        run: |
          python -m pip install ruff black

      - name: Corriger les fichiers Python
        run: |
          ruff check --fix portail_1j1s/assistant/
          black portail_1j1s/assistant/

      - name: Enregistrer les corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portail_1j1s/assistant/
          if ! git diff --cached --quiet; then
            git commit -m "style: formatage automatique du chatbot IA"
            git push
          fi
