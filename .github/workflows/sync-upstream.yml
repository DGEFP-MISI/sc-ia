name: Proposer les évolutions du dépôt officiel

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Jeton de la GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          owner: DGEFP-MISI
          repositories: sc-ia
          permission-contents: write
          permission-pull-requests: write

      - name: Charger la branche recette
        uses: actions/checkout@v4
        with:
          ref: recette
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Préparer une proposition de fusion sans modifier recette
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/numerique-gouv/sites-conformes.git
          git fetch upstream main
          git config user.name "sc-ia-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Aucune nouveauté officielle à proposer."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_sha="$(git rev-parse upstream/main)"
          base_sha="$(git rev-parse HEAD)"
          branch="automation/upstream-review-v3-$(git rev-parse --short=12 upstream/main)-$(git rev-parse --short=8 HEAD)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "has_conflicts=false" >> "$GITHUB_OUTPUT"

          # Préparer un vrai commit de fusion pour afficher les différences dans une PR.
          # En cas de conflit de contenu, garder provisoirement la version de recette.
          # La PR avertit explicitement que ces choix doivent être vérifiés.
          merge_output="$(mktemp)"
          if git merge --no-ff --no-commit upstream/main >"$merge_output" 2>&1; then
            conflicts=""
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              cat "$merge_output"
              echo "::error::Fusion impossible sans conflit de contenu identifiable."
              exit 1
            fi
            echo "has_conflicts=true" >> "$GITHUB_OUTPUT"
            mkdir -p .github
            report=".github/upstream-conflict-review.md"
            {
              echo "# Modifications officielles masquées par les conflits"
              echo
              echo "Ces fichiers ont conservé provisoirement la version de recette."
              echo "**Examiner les différences avant toute fusion.**"
              echo
            } > "$report"
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              {
                printf '## %s\n\n' "$file"
                printf '[Version recette](https://github.com/%s/blob/%s/%s) · ' "$GITHUB_REPOSITORY" "$base_sha" "$file"
                printf '[Version officielle](https://github.com/numerique-gouv/sites-conformes/blob/%s/%s)\n\n' "$upstream_sha" "$file"
                echo '~~~diff'
                # Le rapport conserve au plus 400 lignes de diff par fichier.
                diff -u <(git show ":2:$file") <(git show ":3:$file") | head -n 400 || true
                echo '~~~'
                echo
              } >> "$report"
              if [ "$file" = "sites_conformes/templates/sites_conformes_core/standalone.html" ]; then
                git checkout --ours -- "$file"
                if python3 - "$file" <<'PY'
          import pathlib
          import subprocess
          import sys
          
          path = pathlib.Path(sys.argv[1])
          local = path.read_text()
          official = subprocess.check_output(["git", "show", f":3:{path}"], text=True)
          start = "    {% block follow_newsletter_social_media %}"
          end = "    {% endblock follow_newsletter_social_media %}"
          def extract(value):
              if value.count(start) != 1 or value.count(end) != 1:
                  raise ValueError("bornes de bloc ambiguës")
              a = value.index(start)
              b = value.index(end, a) + len(end)
              return value[a:b]
          try:
              old, new = extract(local), extract(official)
              if '<aside id="cmsfr-block-follow">' not in old:
                  raise ValueError("bloc local inattendu")
              if "aria-label=" not in new or "{% with config=" not in new:
                  raise ValueError("nouveau bloc officiel inattendu")
              if '{% include "sites_conformes_core/blocks/follow.html" %}' not in new:
                  raise ValueError("inclusion officielle absente")
              merged = local.replace(old, new, 1)
              for marker in ("assistant/assistant.css", "assistant/sidebar.html", "assistant/assistant.js"):
                  if local.count(marker) != 1 or merged.count(marker) != 1:
                      raise ValueError("personnalisation assistant IA modifiée")
              path.write_text(merged)
          except ValueError as error:
              print(f"Fusion ciblée ignorée : {error}", file=sys.stderr)
              sys.exit(1)
          PY
                then
                  git add -- "$file"
                  echo "Résolution ciblée appliquée : $file" >> "$GITHUB_STEP_SUMMARY"
                  continue
                fi
              fi
              git checkout --ours -- "$file"
              git add -- "$file"
            done <<< "$conflicts"
            git add "$report"
          fi
          git commit -m "chore: proposer les évolutions officielles $upstream_sha"

          {
            echo "## Évolutions du dépôt officiel à examiner"
            echo
            echo "Cette PR propose la fusion de \`numerique-gouv/sites-conformes\` dans \`recette\`."
            echo "**Aucune modification de recette ni de main n'est automatique.**"
            echo
            echo "- Version officielle : \`$upstream_sha\`"
            echo "- Version de recette au départ : \`$base_sha\`"
            echo
            if [ -n "$conflicts" ]; then
              echo "### Conflits à examiner avant fusion"
              echo
              echo "Les fichiers conflictuels sont documentés dans \`.github/upstream-conflict-review.md\`. Une résolution ciblée peut modifier directement le fichier concerné : vérifier **Files changed**."
              echo "**Comparer ces fichiers avec leur version officielle et réintégrer les changements souhaités avant de fusionner :**"
              echo
              while IFS= read -r file; do
                [ -n "$file" ] && printf -- '- \`%s\`\n' "$file"
              done <<< "$conflicts"
            else
              echo "Aucun conflit Git détecté."
            fi
            echo
            echo "Consulter **Files changed** et les contrôles CI avant toute fusion."
            echo "Les changements de recette vers main restent soumis à une PR manuelle."
          } > "$RUNNER_TEMP/upstream-pr-body.md"

      - name: Ouvrir une PR de revue vers recette
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
          HAS_CONFLICTS: ${{ steps.prepare.outputs.has_conflicts }}
        shell: bash
        run: |
          set -euo pipefail
          # Branche déterministe pour éviter de multiplier les PR lors des relances.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "La branche de proposition existe déjà : $BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          # API REST : utiliser uniquement le jeton de la GitHub App.
          # Ne pas créer de doublon si une PR existe déjà.
          existing="$(gh api --method GET "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f base=recette -f head="$GITHUB_REPOSITORY_OWNER:$BRANCH" \
            --jq '.[0].number // empty')" || exit 1
          if [ -n "$existing" ]; then
            echo "Une PR de revue existe déjà : #$existing"
            exit 0
          fi

          draft=false
          if [ "$HAS_CONFLICTS" = "true" ]; then draft=true; fi
          body="$(cat "$RUNNER_TEMP/upstream-pr-body.md")"
          if gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" \
            -f title="chore: examiner les évolutions du dépôt officiel" \
            -f head="$BRANCH" \
            -f base="recette" \
            -f body="$body" \
            -F draft="$draft" \
            --jq '.html_url'; then
            echo "PR créée avec la GitHub App via l'API REST."
          else
            echo "::warning::La GitHub App n'a pas pu créer la PR via REST."
            echo "## PR à créer manuellement" >> "$GITHUB_STEP_SUMMARY"
            echo "La branche \`$BRANCH\` est prête, mais la création de PR a été refusée." >> "$GITHUB_STEP_SUMMARY"
            echo "[Ouvrir la comparaison et créer une PR](https://github.com/$GITHUB_REPOSITORY/compare/recette...$BRANCH?expand=1)" >> "$GITHUB_STEP_SUMMARY"
          fi
