name: Synchronisation du dépôt officiel

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      PYTHONPATH: .
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dju
          POSTGRES_PASSWORD: djpwd
          POSTGRES_DB: djdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dju -d djdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Créer un jeton temporaire de la GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          owner: DGEFP-MISI
          repositories: sc-ia
          permission-contents: write
          permission-pull-requests: write

      - name: Récupérer le dépôt local
        uses: actions/checkout@v4
        with:
          ref: recette
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Récupérer le dépôt officiel
        id: upstream
        run: |
          git remote add upstream https://github.com/numerique-gouv/sites-conformes.git
          git fetch upstream main
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "sc-ia-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Vérifier et préparer la fusion
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "outcome=up-to-date" >> "$GITHUB_OUTPUT"
            echo "Aucune nouvelle évolution officielle."
            exit 0
          fi

          if git merge --no-ff --no-commit upstream/main; then
            git commit -m "chore: intégrer les évolutions de numerique-gouv/sites-conformes"
            echo "outcome=merged" >> "$GITHUB_OUTPUT"
          else
            mkdir -p .github
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              echo "::error::Échec de fusion sans fichiers conflictuels identifiés."
              exit 1
            fi
            git merge --abort
            {
              echo "# Conflits de synchronisation avec le dépôt officiel"
              echo
              echo "Une fusion automatique a été refusée pour préserver les adaptations SC-IA."
              echo
              echo "- Dépôt officiel : numerique-gouv/sites-conformes"
              echo "- Révision officielle : $(git rev-parse upstream/main)"
              echo "- Révision SC-IA : $(git rev-parse HEAD)"
              echo
              echo "## Fichiers en conflit"
              echo
              while IFS= read -r file; do
                printf -- '- `%s`\n' "$file"
              done <<< "$conflicts"
              echo
              echo "Cette PR est un **signalement de conflit**, pas une fusion prête à intégrer."
              echo "Résoudre manuellement les conflits dans une branche de mise à jour,"
              echo "puis fusionner cette branche dans recette. Ne pas fusionner cette PR de signalement."
            } > .github/upstream-sync-conflicts.md
            echo "outcome=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Installer uv et Python
        if: steps.merge.outputs.outcome == 'merged'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"

      - name: Installer les dépendances (une relance si nécessaire)
        id: dependencies
        continue-on-error: true
        if: steps.merge.outputs.outcome == 'merged'
        run: |
          cp .env.test .env
          uv sync --no-group dev || { sleep 15; uv sync --no-group dev; }

      - name: Contrôles bloquants avant recette
        if: steps.merge.outputs.outcome == 'merged' && steps.dependencies.outcome == 'success'
        id: checks
        continue-on-error: true
        run: |
          set -euo pipefail
          uv run python -m compileall -q config sites_conformes
          uv run python manage.py check
          uv run django-admin makemigrations --check --dry-run --noinput
          uv run python manage.py test --settings config.settings_test

      - name: Mettre à jour recette après validation
        if: steps.merge.outputs.outcome == 'merged' && steps.dependencies.outcome == 'success' && steps.checks.outcome == 'success'
        run: |
          git fetch origin recette
          test "$(git rev-parse origin/recette)" = "${{ steps.upstream.outputs.base_sha }}" || {
            echo "::error::La branche recette a évolué pendant les tests."
            exit 1
          }
          git push origin HEAD:recette

      - name: Proposer les évolutions officielles si les tests échouent
        if: steps.merge.outputs.outcome == 'merged' && (steps.dependencies.outcome == 'failure' || steps.checks.outcome == 'failure')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force origin HEAD:refs/heads/automation/upstream-review
          if ! gh pr view automation/upstream-review --json number >/dev/null 2>&1; then
            gh pr create --base recette --head automation/upstream-review \
              --title "chore: mise à jour officielle à examiner (tests en échec)" \
              --body "La fusion Git est possible, mais les contrôles bloquants ont échoué. Aucun déploiement en recette. Examiner les logs du workflow de synchronisation, corriger si nécessaire, puis valider manuellement cette PR."
          else
            gh pr comment automation/upstream-review --body "Nouvelle tentative de synchronisation : contrôles en échec. Consulter les logs du workflow. Aucun déploiement en recette."
          fi

      - name: Marquer la synchronisation en échec après signalement
        if: steps.merge.outputs.outcome == 'merged' && (steps.dependencies.outcome == 'failure' || steps.checks.outcome == 'failure')
        run: |
          echo "::error::Contrôles bloquants en échec : recette inchangée, PR de diagnostic créée ou actualisée."
          exit 1

      - name: Créer ou actualiser une PR de signalement des conflits
        if: steps.merge.outputs.outcome == 'conflict'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/upstream-conflicts
          base: recette
          title: "chore: conflits lors de la synchronisation du dépôt officiel"
          body: |
            La mise à jour quotidienne a rencontré un ou plusieurs conflits Git.

            **Aucun fichier source n'a été modifié dans recette.**
            Consulter `.github/upstream-sync-conflicts.md` pour la liste des fichiers.

            Cette PR est un signalement et **ne doit pas être fusionnée telle quelle**.
            Préparer une fusion manuelle des évolutions officielles en conservant les personnalisations.
          commit-message: "chore: signaler les conflits de synchronisation"
          add-paths: ".github/upstream-sync-conflicts.md"
          delete-branch: false
