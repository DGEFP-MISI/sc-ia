name: Proposer les évolutions du dépôt officiel

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Jeton de la GitHub App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          owner: DGEFP-MISI
          repositories: sc-ia
          permission-contents: write
          permission-pull-requests: write

      - name: Charger la branche recette
        uses: actions/checkout@v4
        with:
          ref: recette
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Préparer une proposition de fusion sans modifier recette
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/numerique-gouv/sites-conformes.git
          git fetch upstream main
          git config user.name "sc-ia-upstream-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Aucune nouveauté officielle à proposer."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_sha="$(git rev-parse upstream/main)"
          base_sha="$(git rev-parse HEAD)"
          branch="automation/upstream-$(git rev-parse --short=12 upstream/main)-$(git rev-parse --short=8 HEAD)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # Préparer un vrai commit de fusion pour afficher les différences dans une PR.
          # En cas de conflit de contenu, garder provisoirement la version de recette.
          # La PR avertit explicitement que ces choix doivent être vérifiés.
          merge_output="$(mktemp)"
          if git merge --no-ff --no-commit upstream/main >"$merge_output" 2>&1; then
            conflicts=""
          else
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ -z "$conflicts" ]; then
              cat "$merge_output"
              echo "::error::Fusion impossible sans conflit de contenu identifiable."
              exit 1
            fi
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              git checkout --ours -- "$file"
              git add -- "$file"
            done <<< "$conflicts"
          fi
          git commit -m "chore: proposer les évolutions officielles $upstream_sha"

          {
            echo "## Évolutions du dépôt officiel à examiner"
            echo
            echo "Cette PR propose la fusion de \`numerique-gouv/sites-conformes\` dans \`recette\`."
            echo "**Aucune modification de recette ni de main n'est automatique.**"
            echo
            echo "- Version officielle : \`$upstream_sha\`"
            echo "- Version de recette au départ : \`$base_sha\`"
            echo
            if [ -n "$conflicts" ]; then
              echo "### Conflits résolus provisoirement"
              echo
              echo "Les fichiers suivants ont conservé la version de recette pour les zones conflictuelles."
              echo "**Vérifier et corriger ces fichiers avant de fusionner la PR :**"
              echo
              while IFS= read -r file; do
                [ -n "$file" ] && printf -- '- \`%s\`\n' "$file"
              done <<< "$conflicts"
            else
              echo "Aucun conflit Git détecté."
            fi
            echo
            echo "Consulter **Files changed** et les contrôles CI avant toute fusion."
            echo "Les changements de recette vers main restent soumis à une PR manuelle."
          } > "$RUNNER_TEMP/upstream-pr-body.md"

      - name: Ouvrir une PR de revue vers recette
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.prepare.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          # Branche déterministe pour éviter de multiplier les PR lors des relances.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "La branche de proposition existe déjà : $BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          if gh pr list --base recette --head "$BRANCH" --state open --json number --jq 'length' | grep -qx '0'; then
            gh pr create --base recette --head "$BRANCH" \
              --title "chore: examiner les évolutions du dépôt officiel" \
              --body-file "$RUNNER_TEMP/upstream-pr-body.md"
          else
            echo "Une PR de revue est déjà ouverte pour $BRANCH."
          fi
